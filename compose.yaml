services:
  panel:
    build: .
    ports:
      - "127.0.0.1:8083:8083"
    environment:
      MTXUI_LISTEN: ":8083"
      MTXUI_MEDIAMTX_URL: ${MTXUI_MEDIAMTX_URL:-http://host.docker.internal:9997}
      MTXUI_MEDIAMTX_USERNAME: ${MTXUI_MEDIAMTX_USERNAME:-panel}
      MTXUI_MEDIAMTX_PASSWORD: ${MTX_API_PASSWORD:?Set MTX_API_PASSWORD}
      MTXUI_METRICS_URL: ${MTXUI_METRICS_URL:-http://host.docker.internal:9998/metrics}
      MTXUI_METRICS_USERNAME: ${MTXUI_METRICS_USERNAME:-panel}
      MTXUI_METRICS_PASSWORD: ${MTX_API_PASSWORD:?Set MTX_API_PASSWORD}
      MTXUI_BOOTSTRAP_PASSWORD: ${MTXUI_BOOTSTRAP_PASSWORD:?Set MTXUI_BOOTSTRAP_PASSWORD}
      MTXUI_SECURE_COOKIE: "false" # Loopback-only HTTP example. Use true behind HTTPS.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - panel-data:/data
    restart: unless-stopped
volumes:
  panel-data:
